name: Frozen Mac DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reserve disk for frozen payload and image checks
        run: |
          # This ephemeral packaging runner needs no Xcode or Unity installation.
          python3 - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          if shutil.disk_usage('.').free < 28 * 1024**3:
              for app in Path('/Applications').glob('Xcode*.app'):
                  assert app.resolve().parent == Path('/Applications')
                  subprocess.run(['sudo', 'rm', '-rf', str(app)], check=True)
          assert shutil.disk_usage('.').free > 24 * 1024**3, 'Insufficient packaging scratch space'
          PY
      - name: Fetch verified frozen release
        run: |
          df -h .
          curl --fail --location --retry 5 --output payload.zip https://dirtyslots.digitalhigh.co/releases/0.0.16/desktop-payloads/daca22b1d0b4a43a/DirtySlots-0.0.16-Mac-AppleSilicon.zip
      - name: Package and verify mounted and copied app
        run: python3 mac_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DirtySlots-Mac-DMG-0.0.16
          path: out/*
          compression-level: 0
          retention-days: 3
